name: Eval dashboard

on:
  push:
    branches: [master]
    paths:
      - 'evals/results/**'
      - 'evals/dashboard/**'
      - 'evals/lib/**'
      - 'evals/export-results.ps1'
      - 'evals/run-evals.ps1'
      - 'evals/tests/**'
      - 'evals/*/evals.json'
      - 'skills/*/SKILL.md'
      - '.github/workflows/eval-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Test the dashboard
        shell: pwsh
        run: ./evals/tests/Dashboard.Tests.ps1

      - name: Test the metrics
        shell: pwsh
        run: ./evals/tests/Metrics.Tests.ps1

      - name: Build the dashboard
        shell: pwsh
        run: ./evals/dashboard/build-dashboard.ps1 -OutDir _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
